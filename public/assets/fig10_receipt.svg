<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" width="100%" height="100%" style="font-family:'Courier New',Courier,monospace;">
  <rect width="540" height="480" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Receipt Content -->
  <g transform="translate(30, 20)">
    <text x="240" y="22" font-size="16" font-weight="bold" fill="#0f172a" text-anchor="middle">🏥 PHARMACARE PRO</text>
    <text x="240" y="40" font-size="10" fill="#475569" text-anchor="middle">Licensed Community Pharmacy</text>
    <text x="240" y="55" font-size="10" fill="#475569" text-anchor="middle">120 Galle Road, Colombo 03, Sri Lanka</text>
    <text x="240" y="70" font-size="9.5" fill="#475569" text-anchor="middle">Tel: +94 (11) 258 9900 • SLMC Reg: PH-2026-LK</text>

    <line x1="0" y1="85" x2="480" y2="85" stroke="#000000" stroke-dasharray="4,3"/>
    <text x="240" y="103" font-size="11" font-weight="bold" fill="#000000" text-anchor="middle">DISPENSATION RECEIPT / INVOICE</text>
    <line x1="0" y1="112" x2="480" y2="112" stroke="#000000" stroke-dasharray="4,3"/>

