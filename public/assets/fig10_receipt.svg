    <text x="0" y="132" font-size="10" fill="#000000">Invoice: <tspan font-weight="bold">INV-20261028-001</tspan></text>
    <text x="480" y="132" font-size="10" fill="#000000" text-anchor="end">Date: 2026-10-28 14:22</text>

    <text x="0" y="150" font-size="10" fill="#000000">Customer: <tspan font-weight="bold">Sunil Perera</tspan></text>
    <text x="480" y="150" font-size="10" fill="#000000" text-anchor="end">Payment: <tspan font-weight="bold">Card</tspan></text>

    <text x="0" y="168" font-size="10" fill="#b91c1c">Prescription Ref: <tspan font-weight="bold">RX-SL-9912 (Dr. Silva)</tspan></text>

    <line x1="0" y1="180" x2="480" y2="180" stroke="#000000"/>
    <text x="0" y="195" font-size="10" font-weight="bold" fill="#000000">ITEM DESCRIPTION</text>
    <text x="250" y="195" font-size="10" font-weight="bold" fill="#000000">QTY</text>
    <text x="360" y="195" font-size="10" font-weight="bold" fill="#000000" text-anchor="end">PRICE</text>
    <text x="480" y="195" font-size="10" font-weight="bold" fill="#000000" text-anchor="end">AMOUNT</text>
    <line x1="0" y1="202" x2="480" y2="202" stroke="#000000"/>

    <!-- Line Item 1 -->
    <text x="0" y="222" font-size="10" fill="#000000">Amoxicillin 500mg Cap</text>
    <text x="255" y="222" font-size="10" fill="#000000">2</text>
    <text x="360" y="222" font-size="10" fill="#000000" text-anchor="end">480.00</text>
    <text x="480" y="222" font-size="10" fill="#000000" text-anchor="end">960.00</text>

    <!-- Line Item 2 -->
    <text x="0" y="242" font-size="10" fill="#000000">Panadol Extra 500mg</text>
    <text x="255" y="242" font-size="10" fill="#000000">1</text>
    <text x="360" y="242" font-size="10" fill="#000000" text-anchor="end">60.00</text>
    <text x="480" y="242" font-size="10" fill="#000000" text-anchor="end">60.00</text>

    <!-- Totals -->
    <line x1="0" y1="265" x2="480" y2="265" stroke="#000000" stroke-dasharray="4,3"/>
    <text x="0" y="285" font-size="10" fill="#000000">Subtotal:</text>
    <text x="480" y="285" font-size="10" fill="#000000" text-anchor="end">Rs. 1,020.00</text>

    <text x="0" y="305" font-size="10" fill="#000000">Promotional Discount (5%):</text>
    <text x="480" y="305" font-size="10" fill="#000000" text-anchor="end">-Rs. 51.00</text>

    <line x1="0" y1="320" x2="480" y2="320" stroke="#000000" stroke-width="2"/>
    <text x="0" y="342" font-size="13" font-weight="bold" fill="#000000">NET TOTAL PAID:</text>
    <text x="480" y="342" font-size="14" font-weight="bold" fill="#000000" text-anchor="end">Rs. 969.00</text>
    <line x1="0" y1="352" x2="480" y2="352" stroke="#000000" stroke-width="2"/>

    <text x="240" y="380" font-size="9" fill="#475569" text-anchor="middle">Official Medical Receipt for Insurance Reimbursement</text>
    <text x="240" y="398" font-size="9" fill="#475569" text-anchor="middle">Thank you for visiting PharmaCare Pro! Get well soon!</text>
