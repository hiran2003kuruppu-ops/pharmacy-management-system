<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%" style="font-family:'Segoe UI',Inter,sans-serif;">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Collection 1: Users (Top-Left) -->
  <g transform="translate(30, 20)">
    <rect width="210" height="120" rx="6" fill="#f8fafc" stroke="#6366f1" stroke-width="1.8"/>
    <rect width="210" height="26" rx="6" fill="#6366f1"/>
    <text x="105" y="18" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">users (Collection)</text>
    <text x="12" y="44" font-size="9.5" font-weight="bold" fill="#1e293b">_id <tspan fill="#64748b" font-weight="normal">ObjectId (PK)</tspan></text>
    <text x="12" y="60" font-size="9.5" fill="#1e293b">name <tspan fill="#64748b">String (required)</tspan></text>
    <text x="12" y="76" font-size="9.5" fill="#1e293b">email <tspan fill="#64748b">String (unique, indexed)</tspan></text>
    <text x="12" y="92" font-size="9.5" fill="#1e293b">password <tspan fill="#64748b">String (bcrypt hash)</tspan></text>
    <text x="12" y="108" font-size="9.5" fill="#1e293b">role <tspan fill="#64748b">Enum['admin', 'pharmacist']</tspan></text>
  </g>

  <!-- Collection 2: Categories (Top-Center) -->
  <g transform="translate(275, 20)">
    <rect width="210" height="120" rx="6" fill="#f8fafc" stroke="#3b82f6" stroke-width="1.8"/>
    <rect width="210" height="26" rx="6" fill="#3b82f6"/>
    <text x="105" y="18" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">categories (Collection)</text>
    <text x="12" y="44" font-size="9.5" font-weight="bold" fill="#1e293b">_id <tspan fill="#64748b" font-weight="normal">ObjectId (PK)</tspan></text>
    <text x="12" y="60" font-size="9.5" fill="#1e293b">name <tspan fill="#64748b">String (unique, required)</tspan></text>
    <text x="12" y="76" font-size="9.5" fill="#1e293b">description <tspan fill="#64748b">String</tspan></text>
    <text x="12" y="92" font-size="9.5" fill="#1e293b">createdAt, updatedAt <tspan fill="#64748b">Date</tspan></text>
  </g>

  <!-- Collection 3: Suppliers (Top-Right) -->
  <g transform="translate(520, 20)">
    <rect width="210" height="120" rx="6" fill="#f8fafc" stroke="#0d9488" stroke-width="1.8"/>
    <rect width="210" height="26" rx="6" fill="#0d9488"/>
    <text x="105" y="18" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">suppliers (Collection)</text>
    <text x="12" y="44" font-size="9.5" font-weight="bold" fill="#1e293b">_id <tspan fill="#64748b" font-weight="normal">ObjectId (PK)</tspan></text>
    <text x="12" y="60" font-size="9.5" fill="#1e293b">name <tspan fill="#64748b">String (required)</tspan></text>
    <text x="12" y="76" font-size="9.5" fill="#1e293b">contact_person, phone <tspan fill="#64748b">String</tspan></text>
    <text x="12" y="92" font-size="9.5" fill="#1e293b">email, address <tspan fill="#64748b">String</tspan></text>
  </g>

  <!-- Collection 4: Medicines (Center-Right) -->
  <g transform="translate(420, 175)">
    <rect width="310" height="275" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="2"/>
    <rect width="310" height="26" rx="6" fill="#0284c7"/>
    <text x="155" y="18" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">medicines (Collection)</text>
    <text x="12" y="44" font-size="9.5" font-weight="bold" fill="#1e293b">_id <tspan fill="#64748b" font-weight="normal">ObjectId (PK)</tspan></text>
    <text x="12" y="60" font-size="9.5" fill="#1e293b">sku <tspan fill="#64748b">String (unique, indexed)</tspan></text>
    <text x="12" y="76" font-size="9.5" fill="#1e293b">name, generic_name <tspan fill="#64748b">String (indexed)</tspan></text>
    <text x="12" y="94" font-size="9.5" fill="#0369a1" font-weight="600">category <tspan fill="#64748b" font-weight="normal">ObjectId (ref &rarr; Category)</tspan></text>
    <text x="12" y="112" font-size="9.5" fill="#0f766e" font-weight="600">supplier <tspan fill="#64748b" font-weight="normal">ObjectId (ref &rarr; Supplier)</tspan></text>
    <text x="12" y="130" font-size="9.5" fill="#1e293b">dosage_form, strength <tspan fill="#64748b">String (required)</tspan></text>
    <text x="12" y="148" font-size="9.5" fill="#1e293b">cost_price, unit_price <tspan fill="#64748b">Number (min: 0, LKR)</tspan></text>
    <text x="12" y="166" font-size="9.5" fill="#1e293b">quantity_in_stock <tspan fill="#64748b">Number (min: 0)</tspan></text>
    <text x="12" y="184" font-size="9.5" fill="#1e293b">batch_number, expiry_date <tspan fill="#64748b">String, Date</tspan></text>
    <text x="12" y="202" font-size="9.5" fill="#b91c1c" font-weight="bold">requires_prescription <tspan fill="#64748b" font-weight="normal">Boolean</tspan></text>
    <text x="12" y="220" font-size="9.5" fill="#1e293b">audit_trail <tspan fill="#64748b">Array of {type, qty, reason, date}</tspan></text>
    <text x="12" y="238" font-size="9.5" fill="#64748b">virtuals: expiry_status, profit_margin</text>
    <text x="12" y="256" font-size="9.5" fill="#64748b">indexes: { name: 'text', generic_name: 'text' }</text>
  </g>

  <!-- Collection 5: Sales (Center-Left) -->
  <g transform="translate(30, 175)">
    <rect width="340" height="275" rx="6" fill="#f8fafc" stroke="#f59e0b" stroke-width="2"/>
    <rect width="340" height="26" rx="6" fill="#f59e0b"/>
    <text x="170" y="18" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">sales (Collection - Embedded Docs)</text>
    <text x="12" y="44" font-size="9.5" font-weight="bold" fill="#1e293b">_id <tspan fill="#64748b" font-weight="normal">ObjectId (PK)</tspan></text>
    <text x="12" y="60" font-size="9.5" fill="#1e293b">invoice_number <tspan fill="#64748b">String (unique, indexed)</tspan></text>
    <text x="12" y="76" font-size="9.5" fill="#6366f1" font-weight="600">pharmacist <tspan fill="#64748b" font-weight="normal">ObjectId (ref &rarr; User)</tspan></text>
    <text x="12" y="92" font-size="9.5" fill="#1e293b">customer_name, customer_phone <tspan fill="#64748b">String</tspan></text>
    <text x="12" y="108" font-size="9.5" fill="#b91c1c" font-weight="600">prescription_id <tspan fill="#64748b" font-weight="normal">String (validated for Rx)</tspan></text>
    
    <!-- Embedded Sub-Document items box -->
    <rect x="10" y="120" width="320" height="75" rx="4" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="18" y="135" font-size="9.5" font-weight="bold" fill="#8b5cf6">items: [ Array of Embedded Subdocuments ]</text>
    <text x="24" y="152" font-size="8.8" fill="#1e293b">• medicine: ObjectId (ref &rarr; Medicine)</text>
    <text x="24" y="167" font-size="8.8" fill="#1e293b">• medicine_name, sku, quantity, unit_price, total_price</text>
    <text x="24" y="182" font-size="8.8" fill="#64748b">(Normalized embedded snapshot preserves historical prices)</text>

    <text x="12" y="212" font-size="9.5" fill="#1e293b">subtotal, discount_percent, discount_amount <tspan fill="#64748b">Number</tspan></text>
    <text x="12" y="230" font-size="9.5" fill="#1e293b">total_amount <tspan fill="#64748b">Number (LKR Rs.)</tspan></text>
    <text x="12" y="248" font-size="9.5" fill="#1e293b">payment_method <tspan fill="#64748b">Enum['Cash', 'Card', 'Online']</tspan></text>
    <text x="12" y="266" font-size="9.5" fill="#1e293b">createdAt, updatedAt <tspan fill="#64748b">Date (timestamps)</tspan></text>
  </g>

  <!-- Relationship Lines -->
  <!-- Categories to Medicines (1:N Ref) -->
  <path d="M 380 140 L 380 230 L 420 230" stroke="#3b82f6" stroke-width="1.8" fill="none"/>
  <text x="385" y="170" font-size="9" fill="#3b82f6" font-weight="bold">1</text>
  <text x="408" y="225" font-size="9" fill="#3b82f6" font-weight="bold">N (ref)</text>

  <!-- Suppliers to Medicines (1:N Ref) -->
  <path d="M 625 140 L 625 175" stroke="#0d9488" stroke-width="1.8" fill="none"/>
  <text x="630" y="155" font-size="9" fill="#0d9488" font-weight="bold">1:N (ref)</text>

  <!-- Users to Sales (1:N Ref) -->
  <path d="M 135 140 L 135 175" stroke="#6366f1" stroke-width="1.8" fill="none"/>
  <text x="140" y="155" font-size="9" fill="#6366f1" font-weight="bold">1:N (ref)</text>

  <!-- Medicines to Sales Embedded Items (Ref) -->
  <path d="M 420 280 L 370 280" stroke="#0284c7" stroke-width="1.8" fill="none"/>
  <text x="375" y="275" font-size="9" fill="#0284c7" font-weight="bold">item ref</text>
</svg>
