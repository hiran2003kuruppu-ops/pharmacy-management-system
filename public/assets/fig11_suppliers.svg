<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%" style="font-family:'Segoe UI',Inter,sans-serif;">
  <rect width="900" height="420" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
