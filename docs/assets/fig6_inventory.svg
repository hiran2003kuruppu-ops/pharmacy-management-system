<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%" style="font-family:'Segoe UI',Inter,sans-serif;">
  <rect width="900" height="480" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect width="900" height="34" rx="8" fill="#e2e8f0"/>
  <circle cx="20" cy="17" r="5" fill="#ef4444"/>
  <circle cx="36" cy="17" r="5" fill="#f59e0b"/>
  <circle cx="52" cy="17" r="5" fill="#10b981"/>
  <rect x="80" y="7" width="400" height="20" rx="4" fill="#ffffff"/>
  <text x="95" y="21" fill="#64748b" font-size="10.5">http://localhost:3000/#medicines</text>

  <!-- Filter Card -->
  <g transform="translate(30, 50)">
    <rect width="840" height="85" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <!-- Search Bar -->
    <rect x="15" y="12" width="420" height="30" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="30" y="31" fill="#94a3b8" font-size="11">&#128269; Search by brand name, generic name, or SKU barcode...</text>

    <!-- Buttons -->
    <rect x="620" y="12" width="100" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="670" y="31" fill="#0f172a" font-size="10.5" font-weight="600" text-anchor="middle">&#128196; Export CSV</text>
    <rect x="730" y="12" width="95" height="30" rx="6" fill="#0d9488"/>
    <text x="777" y="31" fill="#ffffff" font-size="10.5" font-weight="bold" text-anchor="middle">+ Add Drug</text>

    <!-- Filters Row -->
    <text x="18" y="65" font-size="10" fill="#64748b" font-weight="bold">Category:</text>
    <rect x="75" y="50" width="130" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="85" y="66" font-size="9.5" fill="#0f172a">All Categories &darr;</text>

    <text x="220" y="65" font-size="10" fill="#64748b" font-weight="bold">Stock Status:</text>
    <rect x="290" y="50" width="125" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="300" y="66" font-size="9.5" fill="#0f172a">All Stock Levels &darr;</text>

    <text x="430" y="65" font-size="10" fill="#64748b" font-weight="bold">Expiry Status:</text>
    <rect x="505" y="50" width="130" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="515" y="66" font-size="9.5" fill="#0f172a">All Expiry Dates &darr;</text>

    <text x="650" y="65" font-size="10" fill="#64748b" font-weight="bold">Sort By:</text>
    <rect x="700" y="50" width="125" height="24" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="710" y="66" font-size="9.5" fill="#0f172a">Name (A &rarr; Z) &darr;</text>
  </g>

  <!-- Table Card -->
  <g transform="translate(30, 145)">
    <rect width="840" height="315" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="0" y="0" width="840" height="30" rx="8" fill="#f1f5f9"/>
    <!-- Headers -->
    <text x="15" y="20" font-size="9.5" font-weight="bold" fill="#475569">SKU</text>
    <text x="85" y="20" font-size="9.5" font-weight="bold" fill="#475569">MEDICINE &amp; GENERIC</text>
    <text x="280" y="20" font-size="9.5" font-weight="bold" fill="#475569">CATEGORY</text>
    <text x="420" y="20" font-size="9.5" font-weight="bold" fill="#475569">DOSAGE &amp; STRENGTH</text>
    <text x="555" y="20" font-size="9.5" font-weight="bold" fill="#475569">UNIT PRICE</text>
    <text x="635" y="20" font-size="9.5" font-weight="bold" fill="#475569">STOCK</text>
    <text x="705" y="20" font-size="9.5" font-weight="bold" fill="#475569">EXPIRY</text>
    <text x="770" y="20" font-size="9.5" font-weight="bold" fill="#475569">RX</text>
    <text x="805" y="20" font-size="9.5" font-weight="bold" fill="#475569">ACT</text>

    <!-- Row 1 -->
    <line x1="0" y1="65" x2="840" y2="65" stroke="#f1f5f9"/>
    <text x="15" y="47" font-size="9.5" fill="#0284c7" font-weight="600">MED-1001</text>
    <text x="85" y="44" font-size="10" font-weight="bold" fill="#0f172a">Amoxicillin Trihydrate</text>
    <text x="85" y="57" font-size="8.5" fill="#64748b">Amoxicillin 500mg</text>
    <text x="280" y="49" font-size="9.5" fill="#334155">Antibiotics &amp; Antimicrobials</text>
    <text x="420" y="49" font-size="9.5" fill="#334155">Capsule (500mg)</text>
    <text x="555" y="49" font-size="10" font-weight="bold" fill="#0d9488">Rs. 480.00</text>
    <rect x="630" y="38" width="65" height="18" rx="9" fill="#d1fae5"/>
    <text x="662" y="51" font-size="8.5" font-weight="bold" fill="#065f46" text-anchor="middle">120 Units</text>
    <text x="705" y="49" font-size="9" fill="#475569">2028-10-15</text>
    <rect x="768" y="38" width="22" height="18" rx="4" fill="#fee2e2"/>
    <text x="779" y="51" font-size="8.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">Rx</text>
    <text x="805" y="51" font-size="11" fill="#64748b">&#128065; &#9998; &#128465;</text>

    <!-- Row 2 -->
    <line x1="0" y1="105" x2="840" y2="105" stroke="#f1f5f9"/>
    <text x="15" y="87" font-size="9.5" fill="#0284c7" font-weight="600">MED-1002</text>
    <text x="85" y="84" font-size="10" font-weight="bold" fill="#0f172a">Paracetamol Extra (Panadol)</text>
    <text x="85" y="97" font-size="8.5" fill="#64748b">Acetaminophen 500mg</text>
    <text x="280" y="89" font-size="9.5" fill="#334155">Analgesics &amp; Pain Relief</text>
    <text x="420" y="89" font-size="9.5" fill="#334155">Tablet (500mg)</text>
    <text x="555" y="89" font-size="10" font-weight="bold" fill="#0d9488">Rs. 60.00</text>
    <rect x="630" y="78" width="65" height="18" rx="9" fill="#d1fae5"/>
    <text x="662" y="91" font-size="8.5" font-weight="bold" fill="#065f46" text-anchor="middle">450 Units</text>
    <text x="705" y="89" font-size="9" fill="#475569">2028-04-20</text>
    <rect x="768" y="78" width="25" height="18" rx="4" fill="#f1f5f9"/>
    <text x="780" y="91" font-size="8.5" font-weight="bold" fill="#64748b" text-anchor="middle">OTC</text>
    <text x="805" y="91" font-size="11" fill="#64748b">&#128065; &#9998; &#128465;</text>

    <!-- Row 3 -->
    <line x1="0" y1="145" x2="840" y2="145" stroke="#f1f5f9"/>
    <text x="15" y="127" font-size="9.5" fill="#0284c7" font-weight="600">MED-1003</text>
    <text x="85" y="124" font-size="10" font-weight="bold" fill="#0f172a">Ibuprofen Rapid Release</text>
    <text x="85" y="137" font-size="8.5" fill="#64748b">Ibuprofen 400mg</text>
    <text x="280" y="129" font-size="9.5" fill="#334155">Analgesics &amp; Pain Relief</text>
    <text x="420" y="129" font-size="9.5" fill="#334155">Tablet (400mg)</text>
    <text x="555" y="129" font-size="10" font-weight="bold" fill="#0d9488">Rs. 140.00</text>
    <rect x="630" y="118" width="65" height="18" rx="9" fill="#fef3c7"/>
    <text x="662" y="131" font-size="8.5" font-weight="bold" fill="#b45309" text-anchor="middle">Low: 18</text>
    <text x="705" y="129" font-size="9" fill="#475569">2028-10-15</text>
    <rect x="768" y="118" width="25" height="18" rx="4" fill="#f1f5f9"/>
    <text x="780" y="131" font-size="8.5" font-weight="bold" fill="#64748b" text-anchor="middle">OTC</text>
    <text x="805" y="131" font-size="11" fill="#64748b">&#128065; &#9998; &#128465;</text>

    <!-- Row 4 -->
    <line x1="0" y1="185" x2="840" y2="185" stroke="#f1f5f9"/>
    <text x="15" y="167" font-size="9.5" fill="#0284c7" font-weight="600">MED-1008</text>
    <text x="85" y="164" font-size="10" font-weight="bold" fill="#0f172a">Salbutamol Inhaler (Ventolin)</text>
    <text x="85" y="177" font-size="8.5" fill="#64748b">Albuterol Sulfate</text>
    <text x="280" y="169" font-size="9.5" fill="#334155">Respiratory &amp; Allergy</text>
    <text x="420" y="169" font-size="9.5" fill="#334155">Inhaler (100mcg)</text>
    <text x="555" y="169" font-size="10" font-weight="bold" fill="#0d9488">Rs. 1,450.00</text>
    <rect x="630" y="158" width="65" height="18" rx="9" fill="#d1fae5"/>
    <text x="662" y="171" font-size="8.5" font-weight="bold" fill="#065f46" text-anchor="middle">45 Units</text>
    <text x="705" y="169" font-size="9" fill="#475569">2028-10-15</text>
    <rect x="768" y="158" width="22" height="18" rx="4" fill="#fee2e2"/>
    <text x="779" y="171" font-size="8.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">Rx</text>
    <text x="805" y="171" font-size="11" fill="#64748b">&#128065; &#9998; &#128465;</text>

    <!-- Row 5 (Expired Item) -->
    <line x1="0" y1="225" x2="840" y2="225" stroke="#f1f5f9"/>
    <text x="15" y="207" font-size="9.5" fill="#0284c7" font-weight="600">MED-1012</text>
    <text x="85" y="204" font-size="10" font-weight="bold" fill="#0f172a">Ciprofloxacin Eye/Ear Drops</text>
    <text x="85" y="217" font-size="8.5" fill="#64748b">Ciprofloxacin 0.3%</text>
    <text x="280" y="209" font-size="9.5" fill="#334155">Antibiotics &amp; Antimicrobials</text>
    <text x="420" y="209" font-size="9.5" fill="#334155">Drops (5ml)</text>
    <text x="555" y="209" font-size="10" font-weight="bold" fill="#0d9488">Rs. 390.00</text>
    <rect x="630" y="198" width="65" height="18" rx="9" fill="#fee2e2"/>
    <text x="662" y="211" font-size="8.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">12 Units</text>
    <text x="705" y="209" font-size="9" fill="#ef4444" font-weight="bold">Expired</text>
    <rect x="768" y="198" width="22" height="18" rx="4" fill="#fee2e2"/>
    <text x="779" y="211" font-size="8.5" font-weight="bold" fill="#b91c1c" text-anchor="middle">Rx</text>
    <text x="805" y="211" font-size="11" fill="#64748b">&#128065; &#9998; &#128465;</text>

    <!-- Pagination -->
    <rect x="0" y="275" width="840" height="40" fill="#f8fafc"/>
    <text x="15" y="300" font-size="9.5" fill="#64748b">Showing 1 to 5 of 12 registered medications</text>
    <rect x="740" y="285" width="25" height="22" rx="4" fill="#0d9488"/>
    <text x="752" y="300" font-size="9.5" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
    <rect x="770" y="285" width="25" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="782" y="300" font-size="9.5" fill="#64748b" text-anchor="middle">2</text>
  </g>
</svg>
