<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%" height="100%" style="font-family:'Segoe UI',Inter,sans-serif;">
  <defs>
    <linearGradient id="tier1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="tier2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="tier3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-3%" y="-6%" width="106%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Presentation Tier -->
  <g filter="url(#shadow)">
    <rect x="50" y="20" width="660" height="90" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="50" y="20" width="660" height="28" rx="8" fill="url(#tier1Grad)"/>
    <text x="380" y="39" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="0.5">Presentation Tier — React 19 Client (SPA)</text>
    <text x="75" y="66" fill="#0f172a" font-size="11.5">• React 19 + Vite + Vanilla CSS3 (Custom Design System with Light/Dark Themes)</text>
    <text x="75" y="85" fill="#0f172a" font-size="11.5">• React Router DOM, Context API (Auth), Debounced Search, POS Cart &amp; Chart.js</text>
    <text x="75" y="101" fill="#475569" font-size="10.5">• Axios HTTP Client with JWT Bearer Interceptors &amp; Lucide Modern Icons</text>
  </g>

  <!-- Arrow Tier 1 to Tier 2 -->
  <path d="M 365 110 L 365 145" stroke="#475569" stroke-width="2"/>
  <polygon points="365,148 360,140 370,140" fill="#475569"/>
  <path d="M 395 148 L 395 113" stroke="#475569" stroke-width="2"/>
  <polygon points="395,110 390,118 400,118" fill="#475569"/>
  <text x="408" y="133" fill="#64748b" font-size="9.5" font-weight="600">JSON via HTTP REST</text>

  <!-- Application Tier -->
  <g filter="url(#shadow)">
    <rect x="50" y="150" width="660" height="95" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
    <rect x="50" y="150" width="660" height="28" rx="8" fill="url(#tier2Grad)"/>
    <text x="380" y="169" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="0.5">Application Tier — Express.js 5 REST Server</text>
    <text x="75" y="196" fill="#0f172a" font-size="11.5">• Express 5.0 Router (/api/auth, /api/medicines, /api/sales, /api/categories, /api/suppliers, /api/stats)</text>
    <text x="75" y="215" fill="#0f172a" font-size="11.5">• Domain Controllers: Stock decrement transactions, Rx validations, JWT auth middleware</text>
    <text x="75" y="233" fill="#475569" font-size="10.5">• Mongoose ODM layer, validation hooks, centralized errorHandler.js, CORS &amp; Morgan</text>
  </g>

  <!-- Arrow Tier 2 to Tier 3 -->
  <path d="M 365 245 L 365 280" stroke="#475569" stroke-width="2"/>
  <polygon points="365,283 360,275 370,275" fill="#475569"/>
  <path d="M 395 283 L 395 248" stroke="#475569" stroke-width="2"/>
  <polygon points="395,245 390,253 400,253" fill="#475569"/>
  <text x="408" y="268" fill="#64748b" font-size="9.5" font-weight="600">Mongoose ODM (BSON)</text>

  <!-- Data Tier -->
  <g filter="url(#shadow)">
    <rect x="50" y="285" width="660" height="85" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="2"/>
    <rect x="50" y="285" width="660" height="28" rx="8" fill="url(#tier3Grad)"/>
    <text x="380" y="304" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="0.5">Data Tier — MongoDB Document Database</text>
    <text x="75" y="331" fill="#0f172a" font-size="11.5">• MongoDB Community / Atlas with Mongoose Schemas &amp; Strict Domain Type Constraints</text>
    <text x="75" y="350" fill="#0f172a" font-size="11.5">• Collections: users (bcrypt), categories, suppliers, medicines (compound index), sales</text>
  </g>
</svg>
