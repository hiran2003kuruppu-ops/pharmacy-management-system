<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%" style="font-family:'Segoe UI',Inter,sans-serif;">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- System Boundary Box -->
  <rect x="180" y="20" width="400" height="440" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="380" y="44" fill="#0f766e" font-size="13" font-weight="bold" text-anchor="middle">PharmaCare Pro System Boundary</text>

  <!-- Left Actor: Pharmacist / Dispenser -->
  <g transform="translate(60, 160)">
    <!-- Stick figure -->
    <circle cx="40" cy="30" r="14" fill="#ffffff" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="40" y1="44" x2="40" y2="90" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="15" y1="60" x2="65" y2="60" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="40" y1="90" x2="20" y2="135" stroke="#0284c7" stroke-width="2.5"/>
    <line x1="40" y1="90" x2="60" y2="135" stroke="#0284c7" stroke-width="2.5"/>
    <text x="40" y="155" fill="#0369a1" font-size="11" font-weight="bold" text-anchor="middle">Pharmacist</text>
    <text x="40" y="169" fill="#64748b" font-size="9" text-anchor="middle">(Staff Dispenser)</text>
  </g>

  <!-- Right Actor: Pharmacy Manager / Admin -->
  <g transform="translate(620, 160)">
    <!-- Stick figure -->
    <circle cx="40" cy="30" r="14" fill="#ffffff" stroke="#0f766e" stroke-width="2.5"/>
    <line x1="40" y1="44" x2="40" y2="90" stroke="#0f766e" stroke-width="2.5"/>
    <line x1="15" y1="60" x2="65" y2="60" stroke="#0f766e" stroke-width="2.5"/>
    <line x1="40" y1="90" x2="20" y2="135" stroke="#0f766e" stroke-width="2.5"/>
    <line x1="40" y1="90" x2="60" y2="135" stroke="#0f766e" stroke-width="2.5"/>
    <text x="40" y="155" fill="#0f766e" font-size="11" font-weight="bold" text-anchor="middle">Pharmacy Admin</text>
    <text x="40" y="169" fill="#64748b" font-size="9" text-anchor="middle">(Inventory Manager)</text>
  </g>

  <!-- Use Case Ellipses -->
  <!-- UC1: View Dashboard & KPIs -->
  <ellipse cx="380" cy="75" rx="140" ry="18" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="380" y="79" fill="#0f172a" font-size="10.5" text-anchor="middle">UC1: View Dashboard KPIs &amp; Alert Tables</text>

  <!-- UC2: Search & Filter Medicines -->
  <ellipse cx="380" cy="120" rx="140" ry="18" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="380" y="124" fill="#0f172a" font-size="10.5" text-anchor="middle">UC2: Search &amp; Multi-Filter Medicines</text>

  <!-- UC3: Add New Medicine -->
  <ellipse cx="380" cy="165" rx="140" ry="18" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="380" y="169" fill="#0f172a" font-size="10.5" text-anchor="middle">UC3: Add Medicine Record (Create)</text>

  <!-- UC4: Edit & Stock Adjustment -->
  <ellipse cx="380" cy="210" rx="140" ry="18" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="380" y="214" fill="#0f172a" font-size="10.5" text-anchor="middle">UC4: Edit Medicine &amp; Adjust Stock (Update)</text>

  <!-- UC5: Safe Delete Medicine -->
  <ellipse cx="380" cy="255" rx="140" ry="18" fill="#ffffff" stroke="#ef4444" stroke-width="1.8"/>
  <text x="380" y="259" fill="#0f172a" font-size="10.5" text-anchor="middle">UC5: Safely Remove Unlinked Item (Delete)</text>

  <!-- UC6: POS Cart & Dispensing -->
  <ellipse cx="380" cy="300" rx="140" ry="18" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="380" y="304" fill="#0f172a" font-size="10.5" text-anchor="middle">UC6: Point of Sale Cart &amp; Dispensing</text>

  <!-- UC7: Prescription Validation -->
  <ellipse cx="380" cy="345" rx="140" ry="18" fill="#ffffff" stroke="#d97706" stroke-width="1.8"/>
  <text x="380" y="349" fill="#0f172a" font-size="10.5" text-anchor="middle">UC7: Verify Doctor Prescription ID (Rx)</text>

  <!-- UC8: Issue Invoice Receipt -->
  <ellipse cx="380" cy="390" rx="140" ry="18" fill="#ffffff" stroke="#0284c7" stroke-width="1.8"/>
  <text x="380" y="394" fill="#0f172a" font-size="10.5" text-anchor="middle">UC8: Complete Sale &amp; Print Receipt (LKR)</text>

  <!-- UC9: Manage Categories & Suppliers -->
  <ellipse cx="380" cy="435" rx="140" ry="18" fill="#ffffff" stroke="#0f766e" stroke-width="1.8"/>
  <text x="380" y="439" fill="#0f172a" font-size="10.5" text-anchor="middle">UC9: Manage Drug Categories &amp; Suppliers</text>

  <!-- Connecting Lines from Pharmacist (left) -->
  <line x1="105" y1="210" x2="240" y2="75" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="105" y1="210" x2="240" y2="120" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="105" y1="210" x2="240" y2="300" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="105" y1="210" x2="240" y2="345" stroke="#38bdf8" stroke-width="1.2"/>
  <line x1="105" y1="210" x2="240" y2="390" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Connecting Lines from Admin (right) -->
  <line x1="655" y1="210" x2="520" y2="75" stroke="#2dd4bf" stroke-width="1.2"/>
  <line x1="655" y1="210" x2="520" y2="120" stroke="#2dd4bf" stroke-width="1.2"/>
  <line x1="655" y1="210" x2="520" y2="165" stroke="#2dd4bf" stroke-width="1.2"/>
  <line x1="655" y1="210" x2="520" y2="210" stroke="#2dd4bf" stroke-width="1.2"/>
  <line x1="655" y1="210" x2="520" y2="255" stroke="#2dd4bf" stroke-width="1.2"/>
  <line x1="655" y1="210" x2="520" y2="435" stroke="#2dd4bf" stroke-width="1.2"/>
</svg>
